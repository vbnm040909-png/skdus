    <path d="M908,190 L908,202" stroke="#c85a1e" stroke-width="2.5" fill="none"/>
    <!-- Whiskers -->
    <line x1="860" y1="184" x2="895" y2="180" stroke="#fff" stroke-width="2.5" opacity="0.88"/>
    <line x1="857" y1="194" x2="895" y2="192" stroke="#fff" stroke-width="2.5" opacity="0.88"/>
    <line x1="860" y1="204" x2="895" y2="198" stroke="#fff" stroke-width="2.5" opacity="0.88"/>
    <line x1="921" y1="180" x2="956" y2="184" stroke="#fff" stroke-width="2.5" opacity="0.88"/>
    <line x1="921" y1="192" x2="959" y2="194" stroke="#fff" stroke-width="2.5" opacity="0.88"/>
    <line x1="921" y1="198" x2="956" y2="204" stroke="#fff" stroke-width="2.5" opacity="0.88"/>
    <!-- Eyes (large, excited) -->
    <circle cx="875" cy="157" r="26" fill="#fff"/>
    <circle cx="941" cy="157" r="26" fill="#fff"/>
    <circle cx="877" cy="159" r="18" fill="#2eb5a0"/>
    <circle cx="943" cy="159" r="18" fill="#2eb5a0"/>
    <ellipse cx="877" cy="159" rx="9" ry="15" fill="#1a1a2e"/>
    <ellipse cx="943" cy="159" rx="9" ry="15" fill="#1a1a2e"/>
    <circle cx="871" cy="151" r="6" fill="#fff"/>
    <circle cx="937" cy="151" r="6" fill="#fff"/>

    <path d="M585,162 Q594,248 582,328" stroke="#3d2b1f" stroke-width="24" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="519" cy="179" rx="10" ry="11" fill="#fff"/>
    <ellipse cx="551" cy="179" rx="10" ry="11" fill="#fff"/>
    <circle cx="520" cy="180" r="7" fill="#3d2b1f"/>
    <circle cx="552" cy="180" r="7" fill="#3d2b1f"/>
    <circle cx="522" cy="178" r="2.5" fill="#fff"/>
    <circle cx="554" cy="178" r="2.5" fill="#fff"/>
    <!-- Eyebrows -->
    <path d="M511,166 Q519,161 527,166" stroke="#3d2b1f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M543,166 Q551,161 559,166" stroke="#3d2b1f" stroke-width="3" fill="none" stroke-linecap="round"/>

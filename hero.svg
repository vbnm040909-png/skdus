    <path d="M923,133 Q941,126 959,136" stroke="#c85a1e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Forehead stripes -->
    <path d="M896,107 L899,132" stroke="#c85a1e" stroke-width="3.5" opacity="0.55"/>
    <path d="M908,104 L908,130" stroke="#c85a1e" stroke-width="3.5" opacity="0.55"/>
    <path d="M920,107 L917,132" stroke="#c85a1e" stroke-width="3.5" opacity="0.55"/>

  <!-- Paw print trail from cat -->
  <g fill="#c85a1e" opacity="0.18">
    <circle cx="758" cy="465" r="9"/><circle cx="748" cy="453" r="6"/><circle cx="758" cy="448" r="6"/><circle cx="768" cy="453" r="6"/>
    <circle cx="794" cy="471" r="8"/><circle cx="785" cy="460" r="5"/><circle cx="794" cy="455" r="5"/><circle cx="803" cy="460" r="5"/>
  </g>

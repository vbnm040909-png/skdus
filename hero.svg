    <ellipse cx="558" cy="459" rx="17" ry="9" fill="#001858"/>
    <!-- Dress -->
    <path d="M488,242 L508,395 L572,395 L592,242 Z" fill="#f582ae"/>
    <path d="M488,242 Q540,258 592,242 L588,274 Q540,290 492,274 Z" fill="#d9609a"/>
    <!-- Torso -->
    <rect x="504" y="226" width="72" height="52" rx="11" fill="#f582ae"/>
    <!-- Arms -->

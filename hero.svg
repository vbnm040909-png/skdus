    <ellipse cx="935" cy="465" rx="12" ry="9" fill="#c85a1e"/>
    <ellipse cx="950" cy="470" rx="12" ry="9" fill="#c85a1e"/>
    <ellipse cx="965" cy="465" rx="12" ry="9" fill="#c85a1e"/>

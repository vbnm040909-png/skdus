    <path d="M576,242 Q608,284 614,318" stroke="#FDBCB4" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="462" cy="334" r="13" fill="#FDBCB4"/>
    <circle cx="614" cy="318" r="13" fill="#FDBCB4"/>
    <!-- Neck -->
    <rect x="522" y="212" width="26" height="20" rx="6" fill="#FDBCB4"/>

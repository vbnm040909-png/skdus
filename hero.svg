    <ellipse cx="682" cy="178" rx="10" ry="11" fill="#fff"/>
    <circle cx="649" cy="179" r="7" fill="#3d2b1f"/>
    <circle cx="683" cy="179" r="7" fill="#3d2b1f"/>
    <circle cx="651" cy="177" r="2.5" fill="#fff"/>

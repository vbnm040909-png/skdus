    <polygon points="105,150 107,157 114,157 109,161 111,168 105,164 99,168 101,161 96,157 103,157"/>
    <polygon points="1090,200 1092,207 1099,207 1094,211 1096,218 1090,214 1084,218 1086,211 1081,207 1088,207"/>
